name: Compare release

# Temporary: builds upstream 1.4.2 source and diffs it against the published jar.
on:
  push:
    paths:
      - ".github/workflows/compare-release.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream 1.4.2 source (no diagnostics)
        uses: actions/checkout@v4
        with:
          ref: 0a2de273fa4bdac2489744bf563f2eb546b262b3
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build from source
        run: |
          chmod +x ./gradlew
          ./gradlew build
          mkdir -p /tmp/cmp
          ls -l build/libs
          cp "build/libs/Programmed Circuit Card-1.20.1-1.4.2.jar" /tmp/cmp/src.jar

      - name: Download published jar from Modrinth
        run: |
          UA='User-Agent: kassudi/pcc-compare (diagnostics)'
          curl -s -H "$UA" 'https://api.modrinth.com/v2/search?query=programmed%20circuit%20card&limit=10' \
            | jq -r '.hits[] | "\(.slug)\t\(.title)\t\(.project_id)"'
          SLUG=$(curl -s -H "$UA" 'https://api.modrinth.com/v2/search?query=programmed%20circuit%20card&limit=10' \
            | jq -r '[.hits[] | select(.title | test("programmed circuit card"; "i"))][0].slug')
          echo "slug=$SLUG"
          curl -s -H "$UA" "https://api.modrinth.com/v2/project/$SLUG/version" > /tmp/cmp/versions.json
          jq -r '.[] | "\(.version_number)\t\(.game_versions|join(","))\t\(.loaders|join(","))\t\(.date_published)"' /tmp/cmp/versions.json | head -15
          URL=$(jq -r '[.[] | select(.version_number | test("1\\.4\\.2"))][0].files[0].url' /tmp/cmp/versions.json)
          echo "url=$URL"
          curl -sL -H "$UA" "$URL" -o /tmp/cmp/release.jar
          ls -l /tmp/cmp

      - name: Compare
        run: |
          cd /tmp/cmp
          sha256sum src.jar release.jar
          mkdir s r
          (cd s && unzip -q ../src.jar)
          (cd r && unzip -q ../release.jar)
          echo "=== files only in one jar (excluding classes) ==="
          diff <(cd s && find . -type f ! -name '*.class' | sort) <(cd r && find . -type f ! -name '*.class' | sort) || true
          echo "=== class files only in one jar ==="
          diff <(cd s && find . -name '*.class' | sort) <(cd r && find . -name '*.class' | sort) || true
          echo "=== classes whose bytecode differs (javap -c -p) ==="
          for f in $(cd s && find . -name '*.class' | sort); do
            if [ -f "r/$f" ]; then
              if ! diff -q <(javap -c -p "s/$f" 2>/dev/null) <(javap -c -p "r/$f" 2>/dev/null) >/dev/null; then
                echo "DIFF $f"
              fi
            fi
          done
          echo "=== mods.toml / mixin config / manifest ==="
          for f in META-INF/mods.toml pccard.mixins.json META-INF/MANIFEST.MF; do
            echo "--- $f"; diff <(cat s/$f 2>/dev/null) <(cat r/$f 2>/dev/null) || true
          done
          echo "=== nested jars ==="
          (cd s && find . -name '*.jar'); echo '--'; (cd r && find . -name '*.jar')
